# os5-sysinfo configuration. Edit here or from the app's Configure page in the WD UI.
# Changes take effect when the app is restarted (disable/enable, or Save on the page).

# Serve JSON over HTTP on LISTEN_HOST:LISTEN_PORT  (1 = on, 0 = off)
LISTENER=1
# 0.0.0.0 = all interfaces, or one local IPv4 such as the Tailscale address
LISTEN_HOST=0.0.0.0
LISTEN_PORT=8085
# Leave empty for open access, or set a key: send it as an X-Api-Key header or ?key=
API_KEY=

# Also write the JSON to this file (empty = off), e.g. /shares/Public/os5-sysinfo/status.json
OUTPUT_PATH=

# Seconds between collections (5..3600)
INTERVAL=30

# Include disk serial numbers / model names in the JSON (1 = yes, 0 = no)
INCLUDE_SERIALS=0
INCLUDE_MODELS=1

# Optional heartbeat: fetched with ?status=up&msg=<health>&ping=<ms> after each successful
# collection. Paste an Uptime Kuma "Push" monitor URL here.
HEARTBEAT_URL=
